:root{
  --paper:#f4f3e8; --panel:#fbfaf4; --ink:#231f20; --muted:#5d5a55; --rule:#bdb9ad;
  --red:#b01a32; --pink:#f1cfd8; --cut:#29abe2; --focus:#29abe2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#1d1b1a;--panel:#282523;--ink:#f4f3e8;--muted:#b9b4aa;--rule:#4a4642}
}
:root[data-theme="dark"]{--paper:#1d1b1a;--panel:#282523;--ink:#f4f3e8;--muted:#b9b4aa;--rule:#4a4642}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:1.25rem 1rem 1rem}

header{display:grid;grid-template-columns:1fr auto;gap:1rem 2rem;align-items:start;padding:1rem 0 1.5rem;border-bottom:1px dotted var(--rule)}
.kicker{font-weight:800;font-size:1rem;letter-spacing:.02em;margin:0}
h1{margin:.1rem 0 0;font-weight:800;font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.01em}
.lang{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:.45rem .95rem;font-weight:700;font-size:.9rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.intro em{font-style:normal;font-weight:700;color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .intro em{color:#f39aac}}
:root[data-theme="dark"] .intro em{color:#f39aac}
.intro{grid-column:1/-1;margin:0;max-width:40rem;font-size:clamp(1rem,2.2vw,1.15rem);font-weight:500;line-height:1.5}
ol.rules{grid-column:1/-1;margin:.25rem 0 0;padding-left:1.4rem;font-weight:700;max-width:46rem}
ol.rules li{margin:.2rem 0}

.status{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.5rem;padding:1rem 0}
.status .s{font-weight:500;color:var(--muted)}
.status b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.status .reset{margin-left:auto;border:2px solid var(--ink);background:transparent;border-radius:999px;padding:.4rem 1rem;font-weight:700;font-size:.9rem}

.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.half .hl{margin:0 0 .6rem;font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:.5rem}
.half .hl::before{content:"";width:1.1em;height:.75em;border-radius:3px;background:var(--red)}
.half.e .hl::before{background:var(--pink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.board{gap:28px}.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
@media (min-width:1000px){.board{gap:40px}.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.board{position:relative}.board::after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px dotted var(--rule)}}
.card{position:relative;aspect-ratio:85/55;border:0;padding:0;background:transparent;perspective:900px;container-type:inline-size;border-radius:7cqw}
.card .in{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card .face,.card .back{position:absolute;inset:0;border-radius:7cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:6cqw}
.card .face{font-weight:700;font-size:9cqw;line-height:1.2;text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.card.hard .face{background:var(--red);color:#fff}
.card.easy .face{background:var(--pink);color:#231f20}
.card .back{transform:rotateY(180deg);background:#f4f3e8 center/cover no-repeat;box-shadow:inset 0 0 0 1px #d9d6c8}
.card:hover:not(.done) .face{outline:2px solid var(--cut);outline-offset:-2px}
.card.sel .in{transform:translateY(-6px)}
.card.sel .face{outline:4px solid var(--cut);outline-offset:-4px}
.card.done .in{transform:rotateY(180deg)}
.card.done{cursor:default}
.card.miss .in{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* example modal */
.sheet{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:1rem;padding-top:calc(1rem + env(safe-area-inset-top,0px));padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:rgba(35,31,32,.55);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.sheet.show{opacity:1;visibility:visible}
.sheet .box{width:min(42rem,100%);max-height:100%;overflow:auto;background:#f4f3e8;color:#231f20;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);transform:scale(.92);transition:transform .3s cubic-bezier(.3,.7,.3,1)}
.sheet.show .box{transform:none}
.sheet .top{background:var(--red);color:#fff;padding:1.1rem 1.4rem 1rem}
.sheet .top .lbl{margin:0 0 .5rem;font-weight:700;font-size:.95rem;opacity:.9}
.sheet .top .pair{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .6rem;font-weight:800;font-size:clamp(1.3rem,4.5vw,1.9rem);line-height:1.2}
.sheet .top .pair .e{background:var(--pink);color:#231f20;padding:.05em .35em;border-radius:6px}
.sheet .top .pair .eqs{font-weight:500;font-size:.6em}
.sheet .body{padding:1.25rem 1.4rem 1.4rem;background:#f4f3e8 right bottom/62% auto no-repeat}
.sheet .body .lbl{margin:0 0 .4rem;font-weight:700;font-size:.9rem;color:#5d5a55}
.sheet .ex{font-size:clamp(1.1rem,3.4vw,1.35rem);line-height:1.5;margin:0}
.sheet .ex b{background:linear-gradient(transparent 58%,var(--pink) 58%)}
.sheet .src{color:#5d5a55;margin-top:.6rem}
.sheet .go{margin-top:1.25rem;background:#231f20;color:#f4f3e8;border:0;border-radius:999px;padding:.75rem 1.6rem;font-weight:800;font-size:1rem}
.pairline{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem;margin-bottom:.55rem}
.chip{font-weight:700;padding:.2rem .6rem;border-radius:6px;font-size:.95rem}
.chip.h{background:var(--red);color:#fff}.chip.e{background:var(--pink);color:#231f20}
.eq{font-weight:500;color:var(--muted)}
.ex{margin:0;font-size:1.02rem}
.ex b{background:var(--pink);color:#231f20;font-weight:700;padding:0 .2em;border-radius:3px}
.src{margin:.35rem 0 0;color:var(--muted);font-size:.85rem;font-weight:600}
.close{float:right;border:0;background:transparent;font-size:1.4rem;line-height:1;padding:0 .2rem;color:var(--muted)}

/* end */
.end{display:none;margin-top:2rem;border-top:1px dotted var(--rule);padding-top:1.5rem}
.end.show{display:block}
.end h2{font-weight:800;font-size:clamp(1.6rem,4vw,2.3rem);margin:0}
.end p.sum{margin:.4rem 0 1rem;color:var(--muted);font-weight:500}
.again{background:var(--red);color:#fff;border:0;border-radius:999px;padding:.7rem 1.4rem;font-weight:800}
.list{margin-top:1.5rem;display:grid;gap:0}
.item{padding:.85rem 0;border-bottom:1px dotted var(--rule)}

footer{background:#f4f3e8;color:#231f20;border-top:1px dotted #bdb9ad;margin-top:3rem;padding:2rem 1rem calc(2rem + env(safe-area-inset-bottom,0px))}
footer .in{max-width:1180px;margin:0 auto}
.lg{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1rem 2rem;padding:1.1rem 0}
.lg img{display:block;width:auto;max-width:100%}
.lg.main img{height:clamp(40px,7vw,50px)}
.lg.partners{border-top:1px dotted #bdb9ad;border-bottom:1px dotted #bdb9ad;gap:1.1rem clamp(1.2rem,4vw,2.8rem)}
.lg.partners img{height:clamp(34px,4.5vw,42px)}
@media (max-width:559px){.lg.partners{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;gap:1.25rem .75rem}.lg.partners img{height:auto;max-height:40px;max-width:100%}}
.disc{font-size:.8rem;color:#5d5a55;max-width:46rem;margin:1.25rem auto 0;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .card .in,.sheet .box{transition:none}
  .card.miss .in{animation:none}
}
</style>
</head>

</div>

</div>

}
function texts(){
  const t=T[lang];document.documentElement.lang=lang;
  document.title=t.title+" – "+t.kicker.toLowerCase();
  $("kicker").textContent=t.kicker;$("hlH").textContent=t.hlH;$("hlE").textContent=t.hlE;$("title").textContent=t.title;$("intro").innerHTML=t.intro;
  $("rules").innerHTML=t.rules.map(r=>`<li>${esc(r)}</li>`).join("");
  $("lFound").textContent=t.found;$("lTries").textContent=t.tries;$("reset").textContent=t.reset;$("again").textContent=t.again;
  $("shEq").textContent=t.eq;$("shTitle").textContent=t.pairFound;$("shExL").textContent=t.exL;
  $("disc").textContent=t.disc;logos();
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
}

function deal(){
  const d=DATA[lang],t=T[lang];sel=null;found=0;tries=0;lock=false;
  order=shuffle(d.map((r,i)=>({i,h:1}))).concat(shuffle(d.map((r,i)=>({i,h:0}))));
  const html=order.map((c,k)=>{const x=d[c.i][c.h?3:4];
    return `<button class="card ${c.h?"hard":"easy"}" data-k="${k}" aria-label="${esc(t.card(x,c.h))}"><span class="in"><span class="face">${esc(x)}</span><span class="back" style="background-image:url(${IMG["back_"+lang]})"></span></span></button>`});
  $("gH").innerHTML=html.slice(0,d.length).join("");$("gE").innerHTML=html.slice(d.length).join("");
  $("board").querySelectorAll(".card").forEach(b=>b.onclick=()=>pick(b));
  $("found").textContent=0;$("tries").textContent=0;$("total").textContent=d.length;
  $("end").classList.remove("show");$("list").innerHTML="";$("sheet").classList.remove("show");$("sheet").setAttribute("aria-hidden","true");
}

function pick(b){
  if(lock||b.classList.contains("done"))return;
  if(sel===b){b.classList.remove("sel");sel=null;return}
  const c=order[+b.dataset.k];
  if(!sel){sel=b;b.classList.add("sel");return}
  const s=order[+sel.dataset.k];
  if(s.h===c.h){sel.classList.remove("sel");sel=b;b.classList.add("sel");return} // same colour: switch selection
  tries++;$("tries").textContent=tries;
  const a=sel;sel=null;
  if(s.i===c.i){
    b.classList.add("sel");
    setTimeout(()=>{[a,b].forEach(x=>{x.classList.remove("sel");x.classList.add("done");x.setAttribute("aria-disabled","true")})},180);
    found++;$("found").textContent=found;
    const r=DATA[lang][c.i];const isLast=found===DATA[lang].length;setTimeout(()=>showSheet(r,isLast),650);
    $("live").textContent=T[lang].match(r[3],r[4]);
    $("list").insertAdjacentHTML("beforeend",item(r));
    
  }else{
    lock=true;b.classList.add("sel");
    [a,b].forEach(x=>x.classList.add("miss"));
    $("live").textContent=T[lang].miss;
    setTimeout(()=>{[a,b].forEach(x=>x.classList.remove("miss","sel"));lock=false},450);
  }
}

function exHTML(r){return esc(r[0])+"<b>"+esc(r[1])+"</b>"+esc(r[2])}
function item(r){return `<div class="item"><div class="pairline"><span class="chip h">${esc(r[3])}</span><span class="eq">${esc(T[lang].eq)}</span><span class="chip e">${esc(r[4])}</span></div><p class="ex">${exHTML(r)}</p><p class="src">${esc(r[5])}</p></div>`}
let lastFocus=null;
function showSheet(r,isLast){
  $("shH").textContent=r[3];$("shE").textContent=r[4];$("shEx").innerHTML=exHTML(r);$("shSrc").textContent=r[5];
  $("close").textContent=isLast?T[lang].last:T[lang].close;
  $("shBody").style.backgroundImage="none";
  lastFocus=document.activeElement;
  $("sheet").classList.add("show");$("sheet").setAttribute("aria-hidden","false");
  setTimeout(()=>$("close").focus({preventScroll:true}),50);
}
function hideSheet(){
  if(!$("sheet").classList.contains("show"))return;
  $("sheet").classList.remove("show");$("sheet").setAttribute("aria-hidden","true");
  if(found===DATA[lang].length&&found>0){finish()}else if(lastFocus){lastFocus.focus({preventScroll:true})}
}
function finish(){
  const t=T[lang];
  $("endTitle").textContent=t.endTitle;$("endSum").textContent=t.endSum(tries);
  $("end").classList.add("show");$("end").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}

$("close").onclick=hideSheet;
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")hideSheet()});
$("sheet").addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();$("close").focus()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideSheet()});
$("reset").onclick=deal;$("again").onclick=()=>{deal();window.scrollTo(0,0)};
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  if(b.dataset.l===lang)return;lang=b.dataset.l;try{localStorage.setItem("pp-lang",lang)}catch(e){}
  texts();deal();
});
texts();deal();
</script>
</body>
</html>
